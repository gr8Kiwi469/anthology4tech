<div class="toc-subscriber">
  {{ range .Site.RegularPages }}
    <div class="toc-item">
      <h3 class="toc-title">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h3>
      {{ with .Params.summary }}
        <p class="toc-summary">{{ . }}</p>
      {{ end }}
    </div>
  {{ end }}
</div>
