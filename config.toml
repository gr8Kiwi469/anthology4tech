# ---------------------------------------------------------
# Anthology4Tech - Hugo + PaperMod Configuration
# ---------------------------------------------------------

baseURL = "https://anthology4tech.com/"
title = "Anthology4Tech"
subtitle = "Technical insights, tools, and workflows"
theme = "PaperMod"
languageCode = "en-us"
paginate = 10

# Enable nice URLs
canonifyURLs = true

# ---------------------------------------------------------
# PaperMod Core Parameters
# ---------------------------------------------------------
[params]
#  defaultTheme = "auto"        # auto | dark | light
  defaultTheme = "light"        # auto | dark | light

  disableThemeToggle = false

  customCSS = ["css/brand.css"]

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButton = true
  ShowToc = true               # Table of contents on posts
  TocOpen = false              # TOC collapsed by default

  # Homepage mode (choose one)
#  homeInfoParams = { 
#    Title = "Welcome to Anthology4Tech",
#    Content = "A curated collection of technical insights, workflows, and tools."
#  }
[params.homeInfoParams]
Title = "Anthology4Tech"
Content = """
Curated insights across DevOps, ALM, AI, Cloud, Security, and Leadership.

Explore topics, read deep‑dive posts, and follow the evolving Anthology ecosystem.
"""

  # Author block (optional)
  [params.author]
    name = "Keith"
    email = "your@email.com"

# ---------------------------------------------------------
# Social Icons
# ---------------------------------------------------------
[params.social]
  github = "gr8Kiwi469"
  linkedin = "your-profile"
  email = "your@email.com"

# ---------------------------------------------------------
# Menu Configuration
# ---------------------------------------------------------
[menu]

  [[menu.main]]
    name = "AnthologyAtelier"
    url = "https://anthologyatelier.com/"
#    weight = 20
    weight = 1

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "Topics"
    url = "/Topics/"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/About/"
    weight = 4

# ---------------------------------------------------------
# Taxonomies
# ---------------------------------------------------------
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# ---------------------------------------------------------
# Markdown Rendering
# ---------------------------------------------------------
[markup]
  [markup.highlight]
    noClasses = false
    style = "monokai"

  [markup.goldmark.renderer]
    unsafe = true

# ---------------------------------------------------------
# RSS
# ---------------------------------------------------------
[outputs]
  home = ["HTML", "RSS", "JSON"]
